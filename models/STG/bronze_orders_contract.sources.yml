version: 2
sources:
- name: bronze-orders-contract
  description: Provides verified bronze order data for analytics and reporting
  database: cblab-505208
  schema: raw_data
  tables:
  - name: order
    description: Bronze managed source table under contract protection
    columns:
    - name: order_id
      data_tests:
      - not_null
      - unique
      data_type: STRING
      description: Primary = key order id
    - name: user_id
      data_tests:
      - not_null
      data_type: STRING
      description: User reference
    - name: amount
      data_tests:
      - not_null
      data_type: NUMERIC
      description: Total transaction amount
