      data_tests:
      - not_null
      - unique
      data_type: STRING
      description: Primary key order id
    - name: user_id
      data_tests:
      - not_null
      data_type: STRING
      description: User reference
    - name: amount
      data_tests:
      - not_null
      data_type: NUMBER
      description: Total transaction amount

