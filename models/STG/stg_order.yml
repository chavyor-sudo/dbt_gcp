version: 2

models:
  - name: stg_order
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "amount >= 0"
    columns:
      - name: order_id
        description: "Primary key order id"
        data_tests:
          - unique:
              config:
                warn_if: ">5"
                error_if: ">20"
          - not_null
      - name: user_id
        description: "User reference"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: source('raw_data', 'users')
                field: user_id

      - name: amount
        description: "Total transaction amount"
        data_tests:
          - not_null
          - assert_column_is_positive
      - name: date
        description: "The timestamp when the order was placed."
        tests:
          - not_null
