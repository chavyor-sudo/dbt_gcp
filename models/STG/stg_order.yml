version: 2

models:
  - name: stg_order
    description: "table inclide all order "
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "amount >= 0"
    columns:
          - name: order_id
            description: "The unique identifier (Primary Key) for each order."
            tests:
              - unique
              - not_null

          - name: user_id
            description: "The unique identifier of the user who placed the order."
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw_data', 'users')
                    field: user_id

          - name: amount
            description: "The total purchase amount of the order."
            tests:
              - not_null
      
          - name: date
            description: "The timestamp when the order was placed."
            tests:
              - not_null
