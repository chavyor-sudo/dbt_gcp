apiVersion: "v3.1.0"
kind: "DataContract"
id: "bronze-orders-contract"
name: "Bronze Orders"
version: "1.0.0"
status: "active"

description:
  purpose: "Provides verified bronze order data for analytics and reporting"

schema:
  - name: "raw_data"
    type: "source"
    properties:
      - name: "orders"
        type: "table"
        properties:
          - name: "order_id"
            logicalType: "string"
            required: true
            unique: true
          - name: "user_id"
            logicalType: "string"
            required: true
          - name: "amount"
            logicalType: "number"
            required: true

assertions:
  - type: "sql"
    query: "SELECT COUNT(*) FROM cblab-505208.raw_data.orders WHERE amount < 0"
    mustBe: 0
    description: "Verify that raw source rows have no negative amounts"
