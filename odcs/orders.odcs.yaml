datacontract: "3.0.0" # הגרסה שה-CLI מבין הכי טוב בסנכרון dbt
id: "bronze-orders-contract"
version: "1.0.0"

info:
  title: "Bronze Orders Data Contract"
  description: "Provides verified bronze order data for analytics and reporting"
  owner: "chavy-team"

models:
  order: 
    type: "table"
    description: "Bronze managed table under contract protection"
    fields:
      order_id:
        type: "string"
        description: "Primary key order id"
        required: true
        unique: true
      user_id:
        type: "string"
        description: "User reference"
        required: true
      amount:
        type: "number"
        description: "Total transaction amount"
        required: true
