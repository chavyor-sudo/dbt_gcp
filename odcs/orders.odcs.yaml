datacontract: "3.0.0"
id: "bronze-orders-contract"
version: "1.0.0"

info:
  title: "Bronze Orders Data Contract"
  description: "Data contract defining bronze orders structure"
  owner: "chavy-team"

models:
  stg_order:
    type: "table"
    description: "Bronze managed table under contract protection"
    fields:
      order_id:
        type: "string"
        description: "Primary key order id"
        required: true
        unique: true
      user_id:
        type: "string"
        description: "User reference"
        required: true
      amount:
        type: "number"
        description: "Total transaction amount"
        required: true
    
    quality:
      - type: "custom"
        expression: "amount >= 0"
        description: "Verify   order amount is not negative"
