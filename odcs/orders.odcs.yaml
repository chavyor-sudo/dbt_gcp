datacontract: "3.0.0" # הגרסה המודרנית והרשמית של הכלי!
id: "bronze-orders-contract"
version: "1.0.0"

info:
  title: "Bronze Orders Data Contract"
  description: "Provides verified bronze order data for analytics and reporting"
  owner: "chavy-team"

# המבנה הנכון והרשמי של גרסה 3 עבור סנכרון dbt
models:
  order: # שם הטבלה המדויק שלכם בקובץ src_raw_data.yml
    type: "table"
    description: "Bronze managed table under contract protection"
    fields:
      order_id:
        type: "string"
        description: "Primary key order id"
        required: true
        unique: true
      user_id:
        type: "string"
        description: "User reference"
        required: true
      amount:
        type: "number" # סוג נתונים מספרי תקני בגרסה 3
        required: true
