apiVersion: "v3.1.0"
kind: "DataContract"
id: "bronze-orders-contract"
name: "Bronze Orders"
version: "1.0.0"
status: "active"

description:
  purpose: "Provides verified bronze order data for analytics and reporting"

schema:
  - name: "source:raw_data.order" 
    physicalType: TABLE
    description: "Bronze managed source table under contract protection"
    properties:
      - name: "order_id"
        logicalType: "string"
        description: "Primary key order id"
        required: true
        unique: true
      - name: "user_id"
        logicalType: "string"
        description: "User  reference"
        required: true
      - name: "amount"
        logicalType: "number"
        description: "Total as transaction amount"
        required: true
