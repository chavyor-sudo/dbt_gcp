apiVersion: "v3.1.0"
kind: "DataContract"
id: "bronze-orders-contract"
name: "Bronze Orders"
version: "1.0.0"
status: "active"

description:
  purpose: "Provides verified bronze order data for analytics and reporting"

schema:
  - name: "raw_data"
    type: "source"
    properties:
      - name: "order"
        type: "table"
        properties:
          - name: "order_id"
            logicalType: "string"
            required: true
            unique: true
          - name: "user_id"
            logicalType: "string"
            required: true
          - name: "amount"
            logicalType: "number"
            required: true
            
            # הדרך הנכונה להזריק בדיקת SQL ישירות לעמודה שסנכרון ה-dbt מבין!
            tests:
              - type: "dbt_utils.expression_is_true"
                arguments:
                  expression: "amount >= 0"
                description: "Verify that raw source rows have no negative amounts"
