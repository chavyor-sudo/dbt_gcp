name: Data Contract Sync Automation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'odcs/**.yaml'

jobs:
  sync_contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Datacontract CLI
        run: pip install datacontract-cli

      # 4. יצוא ישיר של החוזה לקובץ בדיקה חדש עם סיומת .yaml קשיחה
      - name: Generate dbt Assets from ODCS
        run: | 
          datacontract export dbt-sources odcs/orders.odcs.yaml > models/STG/src_contract_test.yaml

      # 5. דחיפה חזרה ל-Git - תוקן לעקוב אחרי כל שינוי בתיקיית models ללא חסימות סיומת!
      - name: Auto-Commit Generated dbt Schemas
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: automated dbt schema compilation from ODCS"
          file_pattern: 'models/**/*'
