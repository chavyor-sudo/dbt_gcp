name: Data Contract Sync Automation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'datacontract.yaml' # האוטומציה תתעורר רק אם קובץ החוזה הזה ישתנה

jobs:
  sync_contracts:
    runs-on: ubuntu-latest
    steps:
      # 1. משיכת הקוד של הפרויקט לתוך השרת הווירטואלי של GitHub
      - name: Checkout Code Base
        uses: actions/checkout@v4

      # 2. הרמת סביבת פייתון בשרת
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. התקנת כלי החוזים החיצוני (CLI)
      - name: Install Datacontract CLI
        run: pip install datacontract-cli

      # 4. הרצת הסנכרון - הזרקת חוקי החוזה אוטומטית אל קבצי ה-YAML של dbt
      - name: Generate dbt Assets from ODCS
        run: |
          datacontract dbt sync --contract datacontract.yaml

      # 5. דחיפה (Push) אוטומטית של קבצי ה-dbt המעודכנים בחזרה לתוך ה-PR ב-Git
      - name: Auto-Commit Generated dbt Schemas
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: automated dbt schema compilation from ODCS"
          file_pattern: 'models/**/*.yml'
