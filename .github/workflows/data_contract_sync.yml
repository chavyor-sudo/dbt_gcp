name: Data Contract Sync Automation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'odcs/**.yaml'

jobs:
  sync_contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Datacontract CLI
        run: pip install datacontract-cli

      - name: Generate dbt Assets from ODCS
        run: | 
          datacontract sync odcs/orders.odcs.yaml
        env:
          DATACONTRACT_DBT_SOURCES_PATH: "models/STG/src_raw_data_test.yml"

      - name: Auto-Commit Generated dbt Schemas
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: automated dbt schema compilation from ODCS"
          file_pattern: 'models/**/*'
