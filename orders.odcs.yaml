dataContractSpecification: "3.0.0"
id: "bronze-orders-contract"
name: "Bronze Orders"
version: "1.0.0"
status: "active"

info:
  title: "Bronze Orders Data Contract"
  description: "Data contract defining bronze orders structure"
  owner: "chavy-team"

models:
  stg_order:
    type: "table"
    description: "Orders preparation table"
    fields:
      order_id:
        type: "string"
        description: "Primary key"
        required: true
        unique: true
      user_id:
        type: "string"
        description: "User identifier"
        required: true
      amount:
        type: "number"
        description: "Total order amount"
        required: true

servers:
  production:
    type: "bigquery"
